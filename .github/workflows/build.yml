name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows .NET 8
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\LIS2ControlCenter.sln

      - name: Build
        run: dotnet build .\LIS2ControlCenter.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\LIS2ControlCenter.sln --configuration Release --no-build --verbosity normal

  winamp-plugin:
    name: Winamp plugin x86
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Win32 plugin
        run: cmake -S .\native\LIS2.WinampPlugin -B .\native\LIS2.WinampPlugin\build -A Win32

      - name: Build Win32 plugin
        run: cmake --build .\native\LIS2.WinampPlugin\build --config Release

      - name: Upload gen_lis2.dll
        uses: actions/upload-artifact@v4
        with:
          name: gen_lis2-win32
          path: native/LIS2.WinampPlugin/build/Release/gen_lis2.dll
