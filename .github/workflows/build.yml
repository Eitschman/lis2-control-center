name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avalonia:
    uses: ./.github/workflows/linux-portable.yml

  wmp-legacy-plugin:
    if: ${{ false }} # Legacy-Plug-ins bleiben außerhalb des Produktumfangs.
    name: WMP Legacy plugin ${{ matrix.arch }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            generator: Win32
            artifact: LIS2-WMP-Legacy-win32
          - arch: x64
            generator: x64
            artifact: LIS2-WMP-Legacy-win64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure WMP Legacy plugin
        run: >
          cmake
          -S .\native\LIS2.WmpLegacyPlugin
          -B .\native\LIS2.WmpLegacyPlugin\build-${{ matrix.arch }}
          -A ${{ matrix.generator }}

      - name: Build WMP Legacy plugin
        run: >
          cmake
          --build .\native\LIS2.WmpLegacyPlugin\build-${{ matrix.arch }}
          --config Release

      - name: Encode WMP Legacy plugin for safe download
        shell: pwsh
        run: |
          $dll = ".\native\LIS2.WmpLegacyPlugin\build-${{ matrix.arch }}\Release\lis2_wmp_legacy.dll"
          $out = ".\artifacts\wmp-legacy-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          [Convert]::ToBase64String([IO.File]::ReadAllBytes($dll)) |
            Set-Content -NoNewline -Encoding ascii "$out\lis2_wmp_legacy.dll.b64"
          (Get-FileHash $dll -Algorithm SHA256).Hash |
            Set-Content -Encoding ascii "$out\lis2_wmp_legacy.dll.sha256.txt"

      - name: Upload WMP Legacy plugin
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/wmp-legacy-${{ matrix.arch }}/
          if-no-files-found: error


  wmp-legacy-visualization:
    if: ${{ false }} # Legacy-Plug-ins bleiben außerhalb des Produktumfangs.
    name: WMP Legacy visualization ${{ matrix.arch }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            generator: Win32
            artifact: LIS2-WMP-Legacy-Visualization-win32
          - arch: x64
            generator: x64
            artifact: LIS2-WMP-Legacy-Visualization-win64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure WMP Legacy visualization
        run: >
          cmake
          -S .\native\LIS2.WmpLegacyVisualization
          -B .\native\LIS2.WmpLegacyVisualization\build-${{ matrix.arch }}
          -A ${{ matrix.generator }}

      - name: Build WMP Legacy visualization
        run: >
          cmake
          --build .\native\LIS2.WmpLegacyVisualization\build-${{ matrix.arch }}
          --config Release

      - name: Encode WMP Legacy visualization for safe download
        shell: pwsh
        run: |
          $dll = ".\native\LIS2.WmpLegacyVisualization\build-${{ matrix.arch }}\Release\lis2_wmp_legacy_visualization.dll"
          $out = ".\artifacts\wmp-legacy-visualization-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          [Convert]::ToBase64String([IO.File]::ReadAllBytes($dll)) |
            Set-Content -NoNewline -Encoding ascii "$out\lis2_wmp_legacy_visualization.dll.b64"
          (Get-FileHash $dll -Algorithm SHA256).Hash |
            Set-Content -Encoding ascii "$out\lis2_wmp_legacy_visualization.dll.sha256.txt"

      - name: Upload WMP Legacy visualization
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/wmp-legacy-visualization-${{ matrix.arch }}/
          if-no-files-found: error
