name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows .NET 8
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\LIS2ControlCenter.sln

      - name: Build
        run: dotnet build .\LIS2ControlCenter.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\LIS2ControlCenter.sln --configuration Release --no-build --verbosity normal

      - name: WPF startup smoke test
        run: >
          dotnet run
          --project .\src\LIS2.App\LIS2.App.csproj
          --configuration Release
          --no-build
          --
          --smoke-test

      - name: WPF UI regression test
        run: >
          dotnet run
          --project .\src\LIS2.App\LIS2.App.csproj
          --configuration Release
          --no-build
          --
          --ui-test
          --ui-test-output
          .\artifacts\ui-tests

      - name: Upload UI regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LIS2-UI-Regression
          path: artifacts/ui-tests/
          if-no-files-found: warn

      - name: Publish LIS2 Control Center
        if: github.event_name != 'pull_request'
        run: >
          dotnet publish .\src\LIS2.App\LIS2.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output .\artifacts\LIS2ControlCenter

      - name: Publish Protocol Tester
        if: github.event_name != 'pull_request'
        run: >
          dotnet publish .\tools\LIS2.ProtocolTester\LIS2.ProtocolTester.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output .\artifacts\LIS2.ProtocolTester

      - name: Upload LIS2 Control Center
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: LIS2-Control-Center-win-x64
          path: artifacts/LIS2ControlCenter/
          if-no-files-found: error

      - name: Upload Protocol Tester
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: LIS2-ProtocolTester-win-x64
          path: artifacts/LIS2.ProtocolTester/
          if-no-files-found: error

  winamp-plugin:
    name: Winamp plugin x86
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Win32 plugin
        run: cmake -S .\native\LIS2.WinampPlugin -B .\native\LIS2.WinampPlugin\build -A Win32

      - name: Build Win32 plugin
        run: cmake --build .\native\LIS2.WinampPlugin\build --config Release

      - name: Upload gen_lis2.dll
        uses: actions/upload-artifact@v7
        with:
          name: gen_lis2-win32
          path: native/LIS2.WinampPlugin/build/Release/gen_lis2.dll
          if-no-files-found: error


  wmp-legacy-plugin:
    name: WMP Legacy plugin ${{ matrix.arch }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            generator: Win32
            artifact: LIS2-WMP-Legacy-win32
          - arch: x64
            generator: x64
            artifact: LIS2-WMP-Legacy-win64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure WMP Legacy plugin
        run: >
          cmake
          -S .\native\LIS2.WmpLegacyPlugin
          -B .\native\LIS2.WmpLegacyPlugin\build-${{ matrix.arch }}
          -A ${{ matrix.generator }}

      - name: Build WMP Legacy plugin
        run: >
          cmake
          --build .\native\LIS2.WmpLegacyPlugin\build-${{ matrix.arch }}
          --config Release

      - name: Upload WMP Legacy plugin
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: native/LIS2.WmpLegacyPlugin/build-${{ matrix.arch }}/Release/lis2_wmp_legacy.dll
          if-no-files-found: error
