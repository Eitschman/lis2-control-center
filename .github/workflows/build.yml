name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows .NET 8
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\LIS2ControlCenter.sln

      - name: Build
        run: dotnet build .\LIS2ControlCenter.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\LIS2ControlCenter.sln --configuration Release --no-build --verbosity normal
