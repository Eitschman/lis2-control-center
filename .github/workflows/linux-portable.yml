name: Avalonia builds and packages

on:
  push:
    branches:
      - feature/linux-avalonia
  workflow_dispatch:
    inputs:
      version:
        description: Optional package version for a release rehearsal
        type: string
        default: ''
  workflow_call:
    inputs:
      version:
        type: string
        default: ''


# Cancel superseded runs of this workflow on the same branch or pull request.
# A newer push replaces older queued and in-progress builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: Validate package version
    runs-on: ubuntu-latest
    steps:
      - name: Validate optional version before builds
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$PACKAGE_VERSION" && ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo 'Unsupported package version' >&2
            exit 1
          fi
  windows-tools:
    name: Windows Protocol Tester
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Windows solution without WPF
        run: dotnet build LIS2ControlCenter.sln --configuration Release
      - name: Test remaining source and media libraries
        shell: pwsh
        run: |
          foreach ($project in @('Sources', 'Winamp', 'WindowsMedia', 'WmpLegacy')) {
            dotnet test "tests/LIS2.$project.Tests/LIS2.$project.Tests.csproj" --configuration Release --no-build
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $project" }
          }
      - name: Publish self-contained Protocol Tester
        run: dotnet publish tools/LIS2.ProtocolTester/LIS2.ProtocolTester.csproj --configuration Release --runtime win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -p:Version=${{ inputs.version || '0.1.15' }} --output artifacts/LIS2.ProtocolTester
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Include Protocol Tester licenses
        run: python tools/packaging/bundle_licenses.py --publish artifacts/LIS2.ProtocolTester --assets tools/LIS2.ProtocolTester/obj/project.assets.json --rid win-x64
      - name: Verify Protocol Tester runtime assets
        shell: pwsh
        run: |
          foreach ($file in @('LIS2.ProtocolTester.exe', 'LIS2.ProtocolTester.dll', 'LIS2.ProtocolTester.runtimeconfig.json', 'coreclr.dll')) {
            if (-not (Test-Path "artifacts/LIS2.ProtocolTester/$file")) { throw "Missing Protocol Tester asset: $file" }
          }
      - name: Smoke published Avalonia Protocol Tester
        shell: pwsh
        run: |
          $process = Start-Process 'artifacts/LIS2.ProtocolTester/LIS2.ProtocolTester.exe' -ArgumentList '--smoke-test', 'protocol-smoke' -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw 'Protocol Tester smoke timed out' }
          if ($process.ExitCode -ne 0) { throw "Protocol Tester smoke failed: $($process.ExitCode)" }
          if (-not (Test-Path 'protocol-smoke/result.txt')) { throw 'Protocol Tester smoke result missing' }
      - name: Upload Protocol Tester evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Protocol-Tester-smoke-Windows
          path: protocol-smoke/
          if-no-files-found: error
      - name: Upload Protocol Tester
        uses: actions/upload-artifact@v4
        with:
          name: LIS2-ProtocolTester-win-x64
          path: artifacts/LIS2.ProtocolTester/
          if-no-files-found: error
          retention-days: 14

  wmp-legacy-plugins:
    name: WMP Legacy plug-ins ${{ matrix.arch }}
    needs: metadata
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: win32
            generator: Win32
          - arch: win64
            generator: x64
    steps:
      - uses: actions/checkout@v4
      - name: Build background and visualization plug-ins
        shell: pwsh
        run: |
          foreach ($project in @('LIS2.WmpLegacyPlugin', 'LIS2.WmpLegacyVisualization')) {
            cmake -S "native/$project" -B "native/$project/build" -A '${{ matrix.generator }}'
            if ($LASTEXITCODE -ne 0) { throw "Configure failed: $project" }
            cmake --build "native/$project/build" --config Release
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $project" }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Legacy background lifecycle and radio metadata
        run: ctest --test-dir native/LIS2.WmpLegacyPlugin/build -C Release --output-on-failure
      - name: Prove lifecycle regression detects missing background startup
        shell: pwsh
        run: |
          $source = 'native/LIS2.WmpLegacyPlugin/plugin.cpp'
          $original = [IO.File]::ReadAllBytes($source)
          $text = [Text.Encoding]::UTF8.GetString($original)
          if ([regex]::Matches($text, [regex]::Escape('return StartTimer();')).Count -ne 1) { throw 'Expected one background startup' }
          try {
            [IO.File]::WriteAllText($source, $text.Replace('return StartTimer();', 'return S_OK;'), [Text.UTF8Encoding]::new($false))
            cmake --build native/LIS2.WmpLegacyPlugin/build --config Release --target wmp_metadata_tests
            if ($LASTEXITCODE -ne 0) { throw 'Lifecycle countercheck build failed' }
            ctest --test-dir native/LIS2.WmpLegacyPlugin/build -C Release --output-on-failure
            if ($LASTEXITCODE -eq 0) { throw 'Regression missed disabled background startup' }
          } finally {
            [IO.File]::WriteAllBytes($source, $original)
          }
          cmake --build native/LIS2.WmpLegacyPlugin/build --config Release --target wmp_metadata_tests
          if ($LASTEXITCODE -ne 0) { throw 'Restored lifecycle build failed' }
          ctest --test-dir native/LIS2.WmpLegacyPlugin/build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Restored lifecycle test failed' }
      - name: Verify embedded C and C++ runtime
        shell: pwsh
        run: |
          python -m unittest discover -s tools/packaging -p 'test_check_native_runtime.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Runtime checker regression failed' }
          python tools/packaging/check_native_runtime.py native/LIS2.WmpLegacyPlugin/build/Release/lis2_wmp_legacy.dll native/LIS2.WmpLegacyVisualization/build/Release/lis2_wmp_legacy_visualization.dll
          if ($LASTEXITCODE -ne 0) { throw 'Legacy plug-ins depend on an external C/C++ runtime' }
      - name: Assemble plug-in package and scan with Microsoft Defender
        shell: pwsh
        run: |
          $package = 'artifacts/LIS2-WMP-Legacy-${{ matrix.arch }}'
          New-Item -ItemType Directory -Path "$package/background", "$package/visualization" -Force | Out-Null
          Copy-Item 'native/LIS2.WmpLegacyPlugin/build/Release/lis2_wmp_legacy.dll', 'native/LIS2.WmpLegacyPlugin/README.md' "$package/background/"
          Copy-Item 'native/LIS2.WmpLegacyVisualization/build/Release/lis2_wmp_legacy_visualization.dll', 'native/LIS2.WmpLegacyVisualization/README.md' "$package/visualization/"
          Copy-Item LICENSE "$package/LICENSE"
          $defender = Join-Path $env:ProgramFiles 'Windows Defender/MpCmdRun.exe'
          if (-not (Test-Path $defender)) { throw 'Microsoft Defender scanner unavailable' }
          & $defender -Scan -ScanType 3 -File (Resolve-Path $package).Path -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan failed: $LASTEXITCODE" }
          $archive = 'LIS2-WMP-Legacy-${{ matrix.arch }}.zip'
          Compress-Archive -Path "$package/*" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: LIS2-WMP-Legacy-${{ matrix.arch }}
          path: |
            LIS2-WMP-Legacy-${{ matrix.arch }}.zip
            LIS2-WMP-Legacy-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  winamp-plugin:
    name: Winamp plugin x86
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Win32 plugin
        run: cmake -S native/LIS2.WinampPlugin -B native/LIS2.WinampPlugin/build -A Win32
      - name: Build Win32 plugin
        run: cmake --build native/LIS2.WinampPlugin/build --config Release
      - name: Test Winamp metadata and source transitions
        run: ctest --test-dir native/LIS2.WinampPlugin/build -C Release --output-on-failure
      - name: Verify Winamp cadence regression detects missing sender wakeup
        shell: pwsh
        run: |
          $source = 'native/LIS2.WinampPlugin/plugin.cpp'
          $original = [IO.File]::ReadAllText($source)
          $changed = $original.Replace('if (g_snapshotReady != nullptr) SetEvent(g_snapshotReady);', '')
          if ($changed -eq $original) { throw 'Winamp wakeup countercheck did not change its target.' }
          try {
            [IO.File]::WriteAllText($source, $changed)
            cmake --build native/LIS2.WinampPlugin/build --config Release --target winamp_metadata_tests
            if ($LASTEXITCODE -ne 0) { throw 'Winamp countercheck build failed.' }
            $output = ctest --test-dir native/LIS2.WinampPlugin/build -C Release -R '^winamp_metadata$' --output-on-failure 2>&1
            $result = $LASTEXITCODE
            $output | Write-Output
            if ($result -eq 0 -or ($output -join "`n") -notmatch 'audio cadence') {
              throw 'Winamp cadence regression did not detect the missing sender wakeup.'
            }
          } finally {
            [IO.File]::WriteAllText($source, $original)
          }
          cmake --build native/LIS2.WinampPlugin/build --config Release --target winamp_metadata_tests
          if ($LASTEXITCODE -ne 0) { throw 'Restored Winamp test build failed.' }
          ctest --test-dir native/LIS2.WinampPlugin/build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Restored Winamp tests failed.' }
      - name: Upload gen_lis2.dll
        uses: actions/upload-artifact@v4
        with:
          name: gen_lis2-win32
          path: native/LIS2.WinampPlugin/build/Release/gen_lis2.dll
          if-no-files-found: error
          retention-days: 14

  portable:
    name: .NET 10 shared libraries (${{ matrix.os }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test portable core
        run: dotnet test tests/LIS2.Core.Tests/LIS2.Core.Tests.csproj --configuration Release
      - name: Test portable display
        run: dotnet test tests/LIS2.Display.Tests/LIS2.Display.Tests.csproj --configuration Release
      - name: Test portable fans
        run: dotnet test tests/LIS2.Fans.Tests/LIS2.Fans.Tests.csproj --configuration Release

  avalonia-shell:
    name: Avalonia shell (${{ matrix.os }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build shared Avalonia desktop
        run: dotnet build src/LIS2.App.Avalonia/LIS2.App.Avalonia.csproj --configuration Release
      - name: Test Avalonia runtime and device UI
        if: runner.os == 'Windows'
        run: dotnet test tests/LIS2.App.Avalonia.Tests/LIS2.App.Avalonia.Tests.csproj --configuration Release
      - name: Install Linux credential test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus playerctl python3-dbus python3-gi
      - name: Test Avalonia with isolated Linux Secret Service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/lis2-keyring-data"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/lis2-keyring-runtime"
          install -d -m 700 "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -euc '
            printf "%s" "lis2-isolated-test-password" | gnome-keyring-daemon --unlock --components=secrets
            export LIS2_TEST_PRIVATE_KEYRING=1
            dotnet test tests/LIS2.App.Avalonia.Tests/LIS2.App.Avalonia.Tests.csproj --configuration Release
          '
      - name: Upload rendered device views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Avalonia-device-views-${{ runner.os }}
          path: tests/LIS2.App.Avalonia.Tests/TestResults/screenshots/*.png
          if-no-files-found: error
      - name: Native desktop smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "src/LIS2.App.Avalonia/bin/Release/net10.0/LIS2.App.Avalonia.exe"
          $process = Start-Process $app -ArgumentList '--desktop-smoke', 'desktop-smoke', '--minimized' -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw "Desktop smoke timed out" }
          if ($process.ExitCode -ne 0) { throw "Desktop smoke failed: $($process.ExitCode)" }
          if (-not (Test-Path 'desktop-smoke/result.txt')) { throw "Desktop smoke result missing" }
      - name: Native desktop smoke (Linux X11)
        if: runner.os == 'Linux'
        run: timeout 90s xvfb-run -a dotnet src/LIS2.App.Avalonia/bin/Release/net10.0/LIS2.App.Avalonia.dll --desktop-smoke desktop-smoke --minimized
      # Die zusätzliche X11-Ausführung prüft echte Rasterung bei 150 Prozent.
      - name: Native desktop smoke at 150 percent (Linux X11)
        if: runner.os == 'Linux'
        shell: bash
        env:
          AVALONIA_SCREEN_SCALE_FACTORS: 'screen=1.5'
          LIS2_SMOKE_EXPECT_SCALE: '1.5'
        run: timeout 90s xvfb-run -a -s '-screen 0 2400x1600x24' dotnet src/LIS2.App.Avalonia/bin/Release/net10.0/LIS2.App.Avalonia.dll --desktop-smoke desktop-smoke/dpi150
      - name: Native Protocol Tester smoke (Linux X11)
        if: runner.os == 'Linux'
        run: timeout 45s xvfb-run -a dotnet tools/LIS2.ProtocolTester/bin/Release/net10.0/LIS2.ProtocolTester.dll --smoke-test desktop-smoke/protocol-tester
      - name: Upload native desktop smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Avalonia-desktop-smoke-${{ runner.os }}
          path: desktop-smoke/
          if-no-files-found: error


  portable-app:
    name: Portable Avalonia app (${{ matrix.rid }})
    needs: [portable, avalonia-shell]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained executable
        run: dotnet publish src/LIS2.App.Avalonia/LIS2.App.Avalonia.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -p:Version=${{ inputs.version || '0.1.15' }} --output publish/${{ matrix.rid }}
      - name: Setup Python for package tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and include Windows GSMTC provider
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish src/LIS2.WindowsMedia/LIS2.WindowsMedia.csproj --configuration Release --runtime win-x64 --self-contained false --output publish/windows-media-provider
          if ($LASTEXITCODE -ne 0) { throw "Windows GSMTC provider build failed" }
          $dll = "publish/windows-media-provider/LIS2.WindowsMedia.dll"
          if (-not (Test-Path $dll)) { throw "Missing Windows GSMTC provider: $dll" }
          Copy-Item $dll "publish/${{ matrix.rid }}/LIS2.WindowsMedia.dll"
          Get-ChildItem "publish/windows-media-provider" -Filter "*.dll" |
            Where-Object { $_.Name -ne "LIS2.WindowsMedia.dll" } |
            ForEach-Object { if (-not (Test-Path "publish/${{ matrix.rid }}/$($_.Name)")) { Copy-Item $_.FullName "publish/${{ matrix.rid }}/$($_.Name)" } }
      - name: Verify published executable and runtime assets
        shell: pwsh
        run: |
          $folder = "publish/${{ matrix.rid }}"
          $exe = if ("${{ runner.os }}" -eq "Windows") { "LIS2.App.Avalonia.exe" } else { "LIS2.App.Avalonia" }
          if (-not (Test-Path "$folder/$exe")) { throw "Missing executable: $folder/$exe" }
          $size = (Get-Item "$folder/$exe").Length
          if ($size -lt 10000) { throw "Unexpectedly small executable ($size bytes)" }
          if (-not (Test-Path "$folder/LIS2.App.Avalonia.dll")) { throw "Missing managed application assembly" }
          if (-not (Test-Path "$folder/LIS2.App.Avalonia.runtimeconfig.json")) { throw "Missing runtime configuration" }
          if ("${{ runner.os }}" -eq "Windows" -and -not (Test-Path "$folder/LIS2.WindowsMedia.dll")) { throw "Missing Windows GSMTC provider in publish output" }
          if ("${{ runner.os }}" -eq "Windows") {
            foreach ($dependency in @('WinRT.Runtime.dll', 'Microsoft.Windows.SDK.NET.dll', 'LIS2.WmpLegacy.dll')) {
              if (-not (Test-Path "$folder/$dependency")) { throw "Missing GSMTC runtime dependency: $dependency" }
            }
          }
          Write-Host "Verified ${{ matrix.rid }} executable: $size bytes"
      - name: Smoke packaged Windows GSMTC provider
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process "publish/${{ matrix.rid }}/LIS2.App.Avalonia.exe" -ArgumentList '--media-provider-smoke', 'media-provider-smoke' -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw "GSMTC smoke timed out" }
          if ($process.ExitCode -ne 0) { throw "GSMTC smoke failed: $($process.ExitCode)" }
          Get-Content 'media-provider-smoke/provider.txt'
          Get-Content 'media-provider-smoke/result.txt'
      - name: Upload Windows GSMTC smoke
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Avalonia-GSMTC-smoke-Windows
          path: media-provider-smoke/
          if-no-files-found: error
      - name: Include package documentation
        shell: pwsh
        run: Copy-Item README.md, LICENSE "publish/${{ matrix.rid }}/"
      - name: Include Windows hardware setup guide and permission tool
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'publish/win-x64/tools/windows', 'publish/win-x64/docs' | Out-Null
          Copy-Item 'tools/windows/Set-PawnIoUserAccess.ps1' 'publish/win-x64/tools/windows/'
          Copy-Item 'docs/windows-hardware-sensors.md' 'publish/win-x64/docs/'
      - name: Include package licenses and dependency notices
        shell: pwsh
        run: |
          $assets = @('src/LIS2.App.Avalonia/obj/project.assets.json')
          if ('${{ runner.os }}' -eq 'Windows') { $assets += 'src/LIS2.WindowsMedia/obj/project.assets.json' }
          python tools/packaging/bundle_licenses.py --publish 'publish/${{ matrix.rid }}' --rid '${{ matrix.rid }}' --assets @assets
          if ($LASTEXITCODE -ne 0) { throw 'License packaging failed' }
      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x publish/${{ matrix.rid }}/LIS2.App.Avalonia
          tar -czf LIS2-Avalonia-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .
          sha256sum LIS2-Avalonia-${{ matrix.rid }}.tar.gz > LIS2-Avalonia-${{ matrix.rid }}.sha256
          sha256sum -c LIS2-Avalonia-${{ matrix.rid }}.sha256
      - name: Scan Windows application with Microsoft Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $defender = Join-Path $env:ProgramFiles 'Windows Defender/MpCmdRun.exe'
          if (-not (Test-Path $defender)) { throw 'Microsoft Defender scanner unavailable' }
          & $defender -Scan -ScanType 3 -File (Resolve-Path 'publish/win-x64').Path -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan failed: $LASTEXITCODE" }
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "LIS2-Avalonia-${{ matrix.rid }}.zip"
          $hash = (Get-FileHash "LIS2-Avalonia-${{ matrix.rid }}.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LIS2-Avalonia-${{ matrix.rid }}.zip" | Set-Content -Encoding ascii "LIS2-Avalonia-${{ matrix.rid }}.sha256"
      - name: Build Debian package and check packaging regressions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          release_version='${{ inputs.version }}'
          package_version="${release_version//-/~}"
          if [ -z "$package_version" ]; then package_version="0.0~ci${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"; fi
          echo "LIS2_DEBIAN_VERSION=$package_version" >> "$GITHUB_ENV"
          python3 -m unittest discover -s tools/packaging -p 'test_*.py' -v
          python3 tools/packaging/build_debian.py --publish publish/${{ matrix.rid }} --rid ${{ matrix.rid }} --version "$package_version" --output debian
          cd debian
          sha256sum -c ./*.deb.sha256
      - name: Install extracted Linux package smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth dbus libice6 libsm6 libfontconfig1
      - name: Smoke extracted Linux portable archive on native architecture
        if: runner.os == 'Linux'
        shell: bash
        run: dbus-run-session -- xvfb-run -a python3 tools/packaging/smoke_portable.py --archive LIS2-Avalonia-${{ matrix.rid }}.tar.gz --checksum LIS2-Avalonia-${{ matrix.rid }}.sha256 --rid ${{ matrix.rid }} --output portable-smoke/${{ matrix.rid }}
      - name: Smoke extracted Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m unittest discover -s tools/packaging -p 'test_smoke_portable.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Portable archive regression failed" }
          python tools/packaging/smoke_portable.py --archive LIS2-Avalonia-win-x64.zip --checksum LIS2-Avalonia-win-x64.sha256 --rid win-x64 --output portable-smoke/win-x64
          if ($LASTEXITCODE -ne 0) { throw "Extracted Windows package smoke failed" }
      - name: Upload extracted package smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Avalonia-package-smoke-${{ matrix.rid }}
          path: portable-smoke/${{ matrix.rid }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Install and smoke Debian package on native architecture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          architecture="$(dpkg --print-architecture)"
          for distribution in bookworm trixie; do
            docker run --rm --mount type=bind,src="$PWD/debian",dst=/packages,readonly --mount type=bind,src="$PWD/tools/packaging",dst=/packaging,readonly "debian:$distribution-slim" sh /packaging/smoke_debian.sh "/packages/lis2-control-center_${LIS2_DEBIAN_VERSION}_${architecture}.deb"
          done
      - name: Upload Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: LIS2-Debian-${{ matrix.rid }}
          path: |
            debian/*.deb
            debian/*.deb.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: LIS2-Avalonia-${{ matrix.rid }}
          path: |
            LIS2-Avalonia-${{ matrix.rid }}.tar.gz
            LIS2-Avalonia-${{ matrix.rid }}.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LIS2-Avalonia-${{ matrix.rid }}
          path: |
            LIS2-Avalonia-${{ matrix.rid }}.zip
            LIS2-Avalonia-${{ matrix.rid }}.sha256
          if-no-files-found: error
          retention-days: 14
