name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo 'Unsupported release version' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  packages:
    needs: version
    uses: ./.github/workflows/linux-portable.yml
    with:
      version: ${{ needs.version.outputs.version }}
  release:
    needs: [version, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: LIS2-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: gen_lis2-win32
          path: artifacts/gen_lis2-win32
      - name: Prepare versioned release packages and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, os, pathlib, shutil, zipfile
          source = pathlib.Path('artifacts')
          output = pathlib.Path('release')
          output.mkdir()
          version = os.environ['RELEASE_VERSION']
          for folder in source.glob('LIS2-Avalonia-*'):
              archive = next(path for path in folder.iterdir() if path.name.endswith(('.zip', '.tar.gz')))
              name = archive.name.replace('LIS2-Avalonia-', f'LIS2-Control-Center-{version}-')
              shutil.copy2(archive, output / name)
          for package in source.glob('LIS2-Debian-*/*.deb'):
              shutil.copy2(package, output / package.name)
          with zipfile.ZipFile(output / f'LIS2-ProtocolTester-{version}-win-x64.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in (source / 'LIS2-ProtocolTester-win-x64').rglob('*'):
                  if path.is_file(): archive.write(path, path.relative_to(source / 'LIS2-ProtocolTester-win-x64'))
          shutil.copy2(source / 'gen_lis2-win32/gen_lis2.dll', output / 'gen_lis2.dll')
          packages = sorted(output.iterdir())
          if len(packages) != 7: raise RuntimeError(f'Expected seven release files, got {len(packages)}')
          (output / 'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in packages))
          PYTHON
          cd release
          sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes release/*
